[package]
name = "phoinix-erase"
description = "Secure erase: the only write-capable crate of PhoinixDR (ADR-0014)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
phoinix-core = { workspace = true }
phoinix-block = { workspace = true }
phoinix-device = { workspace = true }
phoinix-volume = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }

[dev-dependencies]
tempfile = { workspace = true }

[lints]
workspace = true
